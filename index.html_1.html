<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    img {
      display: block;
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <img 
    src="https://res.cloudinary.com/dkmk5vbti/image/upload/v1793289093/fun_fvw7bz.jpg" 
    alt="Target Image" 
    crossorigin="anonymous" 
  />

</body>
</html>
